<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#087443">
<title>Coach U7 — iPhone V2</title>
<style>
:root{--g:#087443;--g2:#0a8b50;--ink:#10251d;--muted:#718078;--bg:#f3f7f5;--card:#fff;--line:#e1e9e5;--red:#d93636;--yellow:#e5a400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#dce7e1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;color:var(--ink);overscroll-behavior:none}body{min-height:100svh}.app{width:100%;max-width:430px;min-height:100svh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.header{padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,#0b8150,#087443);color:#fff;display:flex;align-items:center;justify-content:space-between}.title{font-size:20px;font-weight:850}.sub{font-size:12px;opacity:.8;margin-top:2px}.livepill{background:#ffffff1e;border:1px solid #ffffff3b;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:850}
main{padding:12px 12px calc(112px + env(safe-area-inset-bottom))}.screen{display:none}.screen.on{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px;box-shadow:0 4px 18px #0b3d2810}
.matchbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.teamname{font-weight:850;font-size:14px}.vs{font-size:10px;color:var(--muted)}.score{font-size:39px;font-weight:950;letter-spacing:-2px}.timer{font-size:48px;text-align:center;font-weight:950;font-variant-numeric:tabular-nums;color:var(--g);letter-spacing:-2px;margin:4px 0 9px}
button{font:inherit;border:0;min-height:48px;border-radius:15px;font-weight:850;touch-action:manipulation}.primary{background:var(--g);color:#fff}.secondary{background:#eaf5ef;color:var(--g)}.danger{background:#ffeded;color:var(--red)}.yellow{background:#fff4d5;color:#8a6100}.full{width:100%}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.section{font-size:15px;font-weight:900;margin:3px 2px 9px;display:flex;justify-content:space-between}.hint{font-size:10px;color:var(--muted);font-weight:700}
.pitch{height:475px;border-radius:22px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,#31834d 0,#31834d 12.5%,#378b53 12.5%,#378b53 25%);box-shadow:inset 0 0 0 2px #ffffff55;touch-action:none}.pitch:before{content:"";position:absolute;inset:7%;border:2px solid #ffffff99;border-radius:4px}.half{position:absolute;left:7%;right:7%;top:50%;border-top:2px solid #ffffff88}.circle{position:absolute;width:92px;height:92px;border:2px solid #ffffff88;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.box{position:absolute;left:27%;right:27%;height:15%;border:2px solid #ffffff88}.box.top{top:7%}.box.bottom{bottom:7%}.goal{position:absolute;left:40%;right:40%;height:5%;border:2px solid white}.goal.top{top:7%}.goal.bottom{bottom:7%}
.fp{position:absolute;transform:translate(-50%,-50%);z-index:4;text-align:center;touch-action:none;user-select:none}.token{width:48px;height:48px;border-radius:50%;background:white;border:3px solid var(--g);display:grid;place-items:center;font-weight:950;color:var(--g);box-shadow:0 5px 12px #003d2050}.fp.keeper .token{border-color:var(--yellow);background:#fff8dc}.fname{background:#10251ddd;color:white;border-radius:7px;padding:3px 6px;font-size:10px;margin-top:3px;white-space:nowrap}.bench{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.bench button{flex:0 0 auto;min-height:42px;padding:8px 11px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.liveactions{position:sticky;bottom:72px;z-index:10;padding-top:12px;background:linear-gradient(#f3f7f500,#f3f7f5 22%)}.act{min-height:68px;font-size:12px}.act span{display:block;font-size:22px;margin-bottom:2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.person{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:13px;background:#dff1e8;display:grid;place-items:center;color:var(--g);font-weight:900}.grow{flex:1}.small{font-size:11px;color:var(--muted)}.pill{background:#edf7f1;color:var(--g);padding:5px 9px;border-radius:99px;font-size:11px;font-weight:850}
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid #dbe5e0;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;color:#7b8782;min-height:44px;font-size:11px}.nav button.active{color:var(--g)}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:80;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(430px,100%);margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82svh;overflow:auto}.sheet h2{margin:0 0 5px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choices button{min-height:58px}.toast{position:fixed;z-index:100;bottom:96px;left:50%;transform:translateX(-50%);background:#10251d;color:white;padding:12px 16px;border-radius:14px;font-size:13px;display:none;white-space:nowrap;box-shadow:0 8px 25px #0004}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">⚽ Coach U7</div><div class="sub">Tournoi de Versailles · Match 1</div></div><div class="livepill">● LIVE</div></header>
<main>
<section id="live" class="screen on">
 <div class="card">
  <div class="matchbar"><div><div class="teamname">FC EXEMPLE</div><div class="vs">NOUS</div></div><div class="score" id="score">0 — 0</div><div><div class="teamname">PARIS FC</div><div class="vs">ADVERSAIRE</div></div></div>
  <div class="timer" id="timer">00:00</div>
  <div class="twocol"><button class="primary" id="chrono" onclick="toggle()">▶ Démarrer</button><button class="secondary" onclick="pause()">⏸ Pause</button></div>
 </div>
 <div class="section"><span>🏟️ COMPOSITION</span><span class="hint">Glisse les joueurs</span></div>
 <div class="pitch" id="pitch"><div class="half"></div><div class="circle"></div><div class="box top"></div><div class="box bottom"></div><div class="goal top"></div><div class="goal bottom"></div></div>
 <div class="section" style="margin-top:10px"><span>BANC</span><span class="hint">Touche pour entrer</span></div>
 <div class="bench" id="bench"></div>
 <div class="liveactions"><div class="threecol"><button class="primary act" onclick="openSubs()"><span>🔄</span>Changer</button><button class="primary act" onclick="openGoal()"><span>⚽</span>But</button><button class="yellow act" onclick="openKeeper()"><span>🧤</span>Gardien</button></div></div>
</section>

<section id="team" class="screen"><div class="card"><div class="section"><span>👦 EFFECTIF</span><button class="secondary" style="min-height:38px;padding:5px 12px" onclick="addPlayer()">＋</button></div><div id="roster"></div></div></section>
<section id="tournament" class="screen"><div class="card"><div class="section"><span>🏆 TOURNOI</span><span class="pill">U7</span></div><div class="row"><div class="grow"><b>Match 1</b><div class="small">Paris FC</div></div><b>0 — 0</b></div><div class="row"><div class="grow"><b>Match 2</b><div class="small">Versailles</div></div><span class="small">À venir</span></div><div class="row"><div class="grow"><b>Match 3</b><div class="small">Meudon</div></div><span class="small">À venir</span></div></div></section>
<section id="stats" class="screen"><div class="card"><div class="section"><span>📊 TEMPS DE JEU</span><span class="pill">AUTO</span></div><div id="statsList"></div></div><div class="card"><div class="section"><span>⚽ BUTEURS</span></div><div id="scorers">Aucun but</div></div></section>
</main>
<nav class="nav"><button class="active" data-s="live" onclick="go('live')">⚡<br>Live</button><button data-s="team" onclick="go('team')">👦<br>Équipe</button><button data-s="tournament" onclick="go('tournament')">🏆<br>Tournoi</button><button data-s="stats" onclick="go('stats')">📊<br>Stats</button></nav>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
</div>
<script>
const P=[
{id:1,n:'Lucas',num:7,on:true,k:true,x:50,y:88,t:0,kt:0,g:0},{id:2,n:'Hugo',num:4,on:true,k:false,x:50,y:70,t:0,kt:0,g:0},{id:3,n:'Adam',num:8,on:true,k:false,x:30,y:52,t:0,kt:0,g:0},{id:4,n:'Noé',num:9,on:true,k:false,x:70,y:52,t:0,kt:0},{id:5,n:'Tom',num:10,on:true,k:false,x:50,y:31,t:0,kt:0},{id:6,n:'Jules',num:11,on:false,k:false,x:22,y:70,t:0,kt:0,g:0},{id:7,n:'Enzo',num:12,on:false,k:false,x:78,y:70,t:0,kt:0,g:0}
];
let sec=0,run=false,last=Date.now(),goals=[];
const $=id=>document.getElementById(id);
function fmt(v){v=Math.floor(v);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function tick(){let now=Date.now(),d=(now-last)/1000;last=now;if(run){sec+=d;P.forEach(p=>{if(p.on){p.t+=d;if(p.k)p.kt+=d}});$('timer').textContent=fmt(sec);}}
setInterval(tick,250);
function toggle(){run=!run;last=Date.now();$('chrono').textContent=run?'⏸ En cours':'▶ Reprendre';toast(run?'Chrono lancé':'Chrono en pause')}
function pause(){run=false;$('chrono').textContent='▶ Reprendre';toast('Chrono en pause')}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.s===id));render();scrollTo(0,0)}
function render(){
 const pitch=$('pitch');pitch.querySelectorAll('.fp').forEach(e=>e.remove());
 P.filter(p=>p.on).forEach(p=>{let e=document.createElement('div');e.className='fp '+(p.k?'keeper':'');e.style.left=p.x+'%';e.style.top=p.y+'%';e.innerHTML='<div class="token">'+p.num+'</div><div class="fname">'+p.n+'</div>';attachDrag(e,p);pitch.appendChild(e)});
 $('bench').innerHTML=P.filter(p=>!p.on).map(p=>`<button onclick="enter(${p.id})">＋ ${p.n}</button>`).join('');
 $('roster').innerHTML=P.map(p=>`<div class="row"><div class="person"><div class="avatar">${p.num}</div><div><b>${p.n}</b><div class="small">${p.k?'🧤 Gardien possible':''}</div></div></div><span class="pill">${fmt(p.t)}</span></div>`).join('');
 $('statsList').innerHTML=P.map(p=>`<div class="row"><div class="person"><div class="avatar">${p.num}</div><div><b>${p.n}</b><div class="small">🧤 ${fmt(p.kt)} · ⚽ ${p.g}</div></div></div><b>${fmt(p.t)}</b></div>`).join('');
 $('scorers').innerHTML=goals.length?goals.map(n=>`<div class="row"><b>⚽ ${n}</b></div>`).join(''):'Aucun but';
}
function attachDrag(el,p){let startX,startY,ox,oy,moved=false;el.addEventListener('pointerdown',e=>{e.preventDefault();startX=e.clientX;startY=e.clientY;ox=p.x;oy=p.y;el.setPointerCapture(e.pointerId);const move=ev=>{moved=true;let r=$('pitch').getBoundingClientRect();p.x=Math.max(9,Math.min(91,ox+(ev.clientX-startX)/r.width*100));p.y=Math.max(9,Math.min(91,oy+(ev.clientY-startY)/r.height*100));el.style.left=p.x+'%';el.style.top=p.y+'%'};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);if(moved)toast(p.n+' déplacé')};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)})}
function enter(id){let p=P.find(x=>x.id===id),out=P.filter(x=>x.on).sort((a,b)=>a.t-b.t)[0];if(out){out.on=false;p.on=true;toast(out.n+' ➜ '+p.n);render()}}
function openSubs(){let on=P.filter(p=>p.on),off=P.filter(p=>!p.on);$('sheet').innerHTML='<h2>🔄 Remplacement</h2><div class="small">Choisis le joueur qui sort, puis celui qui entre.</div><div class="choices"><div>'+on.map(p=>`<button class="secondary full" onclick="chooseOut(${p.id})">${p.n}<br><span class="small">${fmt(p.t)}</span></button>`).join('')+'</div><div id="inchoices">'+off.map(p=>`<button class="secondary full" onclick="subIn(${p.id})">${p.n}<br><span class="small">${fmt(p.t)}</span></button>`).join('')+'</div></div><button class="secondary full" style="margin-top:10px" onclick="closeModal()">Fermer</button>';showModal()}
let selectedOut=null;function chooseOut(id){selectedOut=id;toast('Sortant sélectionné');}
function subIn(id){if(selectedOut===null){toast('Choisis d’abord le sortant');return}let a=P.find(p=>p.id===selectedOut),b=P.find(p=>p.id===id);a.on=false;b.on=true;selectedOut=null;closeModal();toast(a.n+' ➜ '+b.n);render()}
function openGoal(){$('sheet').innerHTML='<h2>⚽ But !</h2><div class="small">Qui a marqué ?</div><div class="choices">'+P.filter(p=>p.on).map(p=>`<button class="secondary" onclick="goal(${p.id})">${p.n}</button>`).join('')+'</div><button class="secondary full" style="margin-top:10px" onclick="closeModal()">Annuler</button>';showModal()}
function goal(id){let p=P.find(x=>x.id===id);p.g++;goals.push(p.n);$('score').textContent=goals.length+' — 0';closeModal();toast('⚽ But de '+p.n+' !');render()}
function openKeeper(){$('sheet').innerHTML='<h2>🧤 Gardien</h2><div class="small">Choisis le gardien actuel.</div><div class="choices">'+P.filter(p=>p.on).map(p=>`<button class="${p.k?'primary':'secondary'}" onclick="keeper(${p.id})">${p.n}</button>`).join('')+'</div><button class="secondary full" style="margin-top:10px" onclick="closeModal()">Fermer</button>';showModal()}
function keeper(id){P.forEach(p=>p.k=false);P.find(p=>p.id===id).k=true;closeModal();toast('🧤 '+P.find(p=>p.id===id).n+' est gardien');render()}
function addPlayer(){let n=prompt('Prénom du joueur');if(!n)return;P.push({id:Date.now(),n:n.trim(),num:P.length+1,on:false,k:false,x:50,y:50,t:0,kt:0,g:0});render();toast(n+' ajouté')}
function showModal(){$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');selectedOut=null}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
render();
</script>
</body>
</html>
